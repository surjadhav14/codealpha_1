```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Translation Tool</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .language-section {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .language-box {
      flex: 1;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #444;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }

    textarea {
      width: 100%;
      height: 170px;
      resize: none;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      outline: none;
      margin-bottom: 20px;
    }

    textarea:focus,
    select:focus {
      border-color: #667eea;
    }

    .translate-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #667eea;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .translate-btn:hover {
      background: #5568d9;
    }

    .translate-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .result-section {
      margin-top: 25px;
    }

    .result-box {
      min-height: 150px;
      background: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      color: #333;
      white-space: pre-wrap;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .action-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      background: #eee;
      color: #333;
    }

    .action-btn:hover {
      background: #ddd;
    }

    .status {
      text-align: center;
      margin-top: 12px;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      .language-section {
        flex-direction: column;
        gap: 12px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🌐 Language Translator</h1>
    <p class="subtitle">Translate text quickly between different languages</p>

    <div class="language-section">

      <div class="language-box">
        <label for="sourceLanguage">Source Language</label>

        <select id="sourceLanguage">
          <option value="auto">Detect Language</option>
          <option value="en">English</option>
          <option value="hi">Hindi</option>
          <option value="mr">Marathi</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="es">Spanish</option>
          <option value="it">Italian</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="zh">Chinese</option>
          <option value="ar">Arabic</option>
        </select>
      </div>

      <div class="language-box">
        <label for="targetLanguage">Target Language</label>

        <select id="targetLanguage">
          <option value="hi">Hindi</option>
          <option value="en">English</option>
          <option value="mr">Marathi</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="es">Spanish</option>
          <option value="it">Italian</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="zh">Chinese</option>
          <option value="ar">Arabic</option>
        </select>
      </div>

    </div>

    <label for="inputText">Enter Text</label>

    <textarea
      id="inputText"
      placeholder="Type or paste the text you want to translate..."
    ></textarea>

    <button class="translate-btn" id="translateButton">
      Translate
    </button>

    <div class="result-section">

      <label>Translated Text</label>

      <div class="result-box" id="result">
        Your translation will appear here...
      </div>

      <div class="actions">

        <button class="action-btn" onclick="copyTranslation()">
          📋 Copy
        </button>

        <button class="action-btn" onclick="speakTranslation()">
          🔊 Speak
        </button>

      </div>

      <p class="status" id="status"></p>

    </div>

  </div>

  <script>

    const translateButton = document.getElementById("translateButton");

    translateButton.addEventListener("click", translateText);

    async function translateText() {

      const text = document.getElementById("inputText").value.trim();
      const source = document.getElementById("sourceLanguage").value;
      const target = document.getElementById("targetLanguage").value;

      const result = document.getElementById("result");
      const status = document.getElementById("status");

      if (!text) {
        result.textContent = "Please enter some text to translate.";
        return;
      }

      if (source === target && source !== "auto") {
        result.textContent = text;
        status.textContent = "Source and target languages are the same.";
        return;
      }

      translateButton.disabled = true;
      translateButton.textContent = "Translating...";
      status.textContent = "Please wait...";

      try {

        /*
          MyMemory Translation API
          This API is used here for demonstration purposes.
        */

        let url =
          "https://api.mymemory.translated.net/get?q=" +
          encodeURIComponent(text) +
          "&langpair=" +
          encodeURIComponent(source === "auto" ? "en" : source) +
          "|" +
          encodeURIComponent(target);

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("Translation request failed");
        }

        const data = await response.json();

        if (
          data.responseData &&
          data.responseData.translatedText
        ) {

          result.textContent =
            data.responseData.translatedText;

          status.textContent = "Translation completed successfully.";

        } else {

          throw new Error("No translation received");

        }

      } catch (error) {

        result.textContent =
          "Unable to translate right now. Please try again.";

        status.textContent =
          "Something went wrong while connecting to the translation service.";

        console.error(error);

      } finally {

        translateButton.disabled = false;
        translateButton.textContent = "Translate";

      }
    }

    function copyTranslation() {

      const result =
        document.getElementById("result").textContent;

      if (
        result === "Your translation will appear here..." ||
        result === "Please enter some text to translate."
      ) {
        return;
      }

      navigator.clipboard.writeText(result);

      document.getElementById("status").textContent =
        "Translation copied to clipboard!";

    }

    function speakTranslation() {

      const result =
        document.getElementById("result").textContent;

      if (
        result === "Your translation will appear here..." ||
        result === "Please enter some text to translate."
      ) {
        return;
      }

      const target =
        document.getElementById("targetLanguage").value;

      const speech = new SpeechSynthesisUtterance(result);

      const languageMap = {
        en: "en-US",
        hi: "hi-IN",
        mr: "mr-IN",
        fr: "fr-FR",
        de: "de-DE",
        es: "es-ES",
        it: "it-IT",
        ja: "ja-JP",
        ko: "ko-KR",
        zh: "zh-CN",
        ar: "ar-SA"
      };

      speech.lang = languageMap[target] || "en-US";

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(speech);

    }

  </script>

</body>
</html>
